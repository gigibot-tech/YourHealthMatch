[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"
  included_files = ["backend/**"]

[[redirects]]
  from = "/api/interest"
  to = "/.netlify/functions/interest"
  status = 200
  force = true

[[redirects]]
  from = "/api/interest/*"
  to = "/.netlify/functions/interest/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

# SPA fallback for SvelteKit adapter-static
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
